[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
]

[advisories]
version = 2
# Fail on any RUSTSEC advisory. Add specific IDs here only with a comment
# explaining why the advisory does not apply to us.
ignore = [
    # paste crate is unmaintained (RUSTSEC-2024-0436). It is a transitive
    # dependency pulled in by ratatui; we do not use it directly and it has
    # no known exploitable vulnerability.
    { id = "RUSTSEC-2024-0436", reason = "transitive dep via ratatui; no direct usage" },

    # The three zip advisories below (RUSTSEC-2026-0367/0368/0369) concern
    # ZipArchive::extract() and ZipStreamReader::extract(). We never call
    # those APIs; we extract entries manually via by_index() with our own
    # zip-slip guard and do not preserve Unix permissions or follow symlinks.
    { id = "RUSTSEC-2026-0367", reason = "we do not call ZipArchive::extract(); manual by_index() extraction with zip-slip guard" },
    { id = "RUSTSEC-2026-0368", reason = "we do not call ZipArchive::extract(); symlink traversal advisory does not apply" },
    { id = "RUSTSEC-2026-0369", reason = "we do not call extract(); permissions-through-symlinks advisory does not apply" },

    # RUSTSEC-2026-0429: ZipArchive::extract() aborts the process on a symlink
    # entry with a large declared size. Same class as the 0367-0369 advisories:
    # we extract via by_index() with our own zip-slip guard and never call
    # extract(), so this does not apply.
    { id = "RUSTSEC-2026-0429", reason = "we do not call ZipArchive::extract(); manual by_index() extraction, advisory does not apply" },
]

[licenses]
version = 2
# Permissive licenses only. Anything copyleft needs a deliberate decision,
# so it should fail here and be discussed rather than silently vendored.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
# The list above is deliberately broader than the current tree so that adding a
# dependency under another permissive license does not fail CI on day one.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Nothing should pull in an alternative to what we already depend on.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

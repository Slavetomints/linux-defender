name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # fmt does not compile, so no musl target is needed here.
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-unknown-linux-musl
      - name: Install musl tooling
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl tooling
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-features --locked

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl tooling
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      # The SUID test walks the whole root filesystem and is #[ignore]d by
      # default; run it here on a throwaway runner where the cost is acceptable.
      # Root-only tests self-skip when the runner is not root.
      - run: cargo test --all-features --locked
      - run: cargo test --all-features --locked -- --ignored

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          targets: x86_64-unknown-linux-musl
      - name: Install musl tooling
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # The interactive TUI/wizard code and root-gated system mutation cannot run
      # in CI, so they are excluded from the measurement and the floor reflects the
      # testable core. Raise it as the testable surface grows.
      # Coverage percentages shift with the LLVM/toolchain version, so the floor
      # is set with headroom below the current measurement (≈38% lines / 61% fns
      # on stable 1.100) rather than at the exact number.
      - run: >
          cargo llvm-cov --all-features
          --ignore-filename-regex '(tui/|wizards|tools|main\.rs)'
          --fail-under-lines 32 --fail-under-functions 52

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl tooling
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

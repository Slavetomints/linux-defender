[package]
name = "linux-defender"
version = "1.0.32"
edition = "2024"
# Verified in CI by .github/workflows/msrv.yml. Edition 2024 sets a hard floor
# of 1.85; 1.86 is the oldest version the dependency tree builds and tests on.
rust-version = "1.88"
description = "CCDC system hardening, anti-persistence, and backup tooling"
repository = "https://github.com/UWStout-CCDC/linux-defender"
license = "MIT"
# Test targets are declared explicitly below so tests/common.rs stays a shared
# helper module rather than being auto-discovered as its own test binary.
autotests = false

[lib]
name = "linux_defender"
path = "src/lib.rs"

[[bin]]
name = "linux-defender"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4.43", features = ["alloc", "std"] }
clap = { version = "4.5.58", features = ["derive"] }
crossterm = "0.28"
libc = "0.2"
nix = { version = "0.31.1", features = ["user", "ioctl"] }
ratatui = "0.29"
regex = "1"
sha2 = "0.10"
thiserror = "2"
walkdir = "2.5.0"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

# One test binary per top-level source module it exercises.
[[test]]
name = "anti_persistence"
path = "tests/anti_persistence.rs"

[[test]]
name = "backups"
path = "tests/backups.rs"

[[test]]
name = "core"
path = "tests/core.rs"

[[test]]
name = "monitoring"
path = "tests/monitoring.rs"

[[test]]
name = "system_hardening"
path = "tests/system_hardening.rs"

[[test]]
name = "service_restore"
path = "tests/service_restore.rs"

# Drives the built binary end to end; covers src/main.rs.
[[test]]
name = "cli"
path = "tests/cli.rs"

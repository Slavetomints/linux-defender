name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * 0"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    # The .cargo/config.toml default target is musl; CodeQL's autobuild only
    # needs a successful compile to analyze, so pin gnu to avoid setting up the
    # musl toolchain inside the CodeQL build environment.
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu

    strategy:
      fail-fast: false
      matrix:
        language:
          - rust

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4.37.9
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/autobuild@v4.37.9

      - uses: github/codeql-action/analyze@v4.37.9

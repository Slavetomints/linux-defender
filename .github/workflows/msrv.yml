name: MSRV Audit

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "tests/**"
      - ".github/workflows/msrv.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "tests/**"
      - ".github/workflows/msrv.yml"

permissions:
  contents: read

jobs:
  msrv:
    name: Verify MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract MSRV from Cargo.toml
        id: msrv
        run: |
          MSRV=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [[ -z "$MSRV" ]]; then
            echo "::error::Could not extract rust-version from Cargo.toml"
            exit 1
          fi
          echo "Detected MSRV: $MSRV"
          echo "msrv=$MSRV" >> "$GITHUB_OUTPUT"

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}

      - uses: Swatinem/rust-cache@v2

      # MSRV is a compiler-version check, not a target check: build for the
      # always-available gnu target and override the repo's musl default (which
      # would otherwise need the musl std + musl-tools installed for this toolchain).
      - name: Build against MSRV
        run: cargo build --all-features --locked --target x86_64-unknown-linux-gnu

      - name: Test against MSRV
        run: cargo test --all-features --locked --target x86_64-unknown-linux-gnu
